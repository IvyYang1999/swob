name: Windows Native Alpha

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-alpha.yml'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: swob-windows-native-alpha-x64
          path: dist/*-windows-x64.exe
          if-no-files-found: error
          retention-days: 14
