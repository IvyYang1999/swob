name: macOS Signing Smoke Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose zero-side-effect gates or the credentialed signing smoke
        required: true
        default: signing-smoke
        type: choice
        options:
          - signing-smoke
          - release-gates

concurrency:
  group: macos-signing-smoke
  cancel-in-progress: false

jobs:
  release-gates-dry-run:
    if: inputs.mode == 'release-gates'
    uses: ./.github/workflows/release-gates-dry-run.yml

  signing-smoke:
    if: inputs.mode == 'signing-smoke'
    name: Sign, notarize, and verify
    runs-on: macos-latest
    timeout-minutes: 45

    # This workflow must never create a tag, release, or published asset.
    permissions:
      contents: read

    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preflight notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/preflight-notarization.sh

      - name: Install a clean locked dependency tree
        run: |
          set -euo pipefail
          if [[ -e node_modules || -L node_modules ]]; then
            echo 'Signing smoke checkout must start without node_modules.' >&2
            exit 1
          fi
          npm ci
          if [[ ! -d node_modules || -L node_modules ]]; then
            echo 'npm ci must produce a real node_modules directory, never a symlink.' >&2
            exit 1
          fi
          npm ls readdirp --all

      - name: Run repository compliance and consistency gates
        run: npm run check

      - name: Build, sign, and notarize both architectures
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "Required Developer ID signing secrets are missing." >&2
            exit 1
          fi

          npx electron-vite build
          npx electron-builder --mac --publish never
          for dmg_file in dist/*.dmg; do
            xcrun notarytool submit "$dmg_file" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg_file"
          done

      - name: Verify every unpacked, ZIP, and mounted-DMG application
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          scripts/release/verify-macos-artifacts.sh \
            dist \
            "$version" \
            swob-signed \
            ZPTA4LP594

          {
            echo '## macOS signing smoke test passed'
            echo
            echo '- Shared verifier passed for unpacked, ZIP, and mounted-DMG apps'
            echo '- Developer ID, Team ID, hardened runtime, Gatekeeper, and notarization verified'
            echo '- Package allowlist passed for every application copy'
            echo '- Exactly six local assets; no update metadata or DMG blockmap'
            echo '- No tag or GitHub Release was created'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload temporary smoke-test installers
        uses: actions/upload-artifact@v4
        with:
          name: swob-macos-signed-smoke-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.zip.blockmap
          if-no-files-found: error
          retention-days: 3
