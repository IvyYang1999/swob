appId: com.swob.app
productName: Swob
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{tsconfig,tsconfig.*}.json'
extraResources:
  - from: out/main/cli.js
    to: cli/cli.js
  - from: out/main/chunks/
    to: cli/chunks/
mac:
  # Release builds must fail closed: Developer ID signing, hardened runtime,
  # notarization, and stapling are all required for Gatekeeper acceptance.
  hardenedRuntime: true
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: swob-${version}-${arch}.${ext}
win:
  # t107 Alpha is an internal, unsigned x64 build. ARM64 and signing are intentionally out of scope.
  target:
    - target: nsis
      arch:
        - x64
  artifactName: swob-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: IvyYang1999
  repo: swob
  releaseType: release
