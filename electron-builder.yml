appId: com.swob.app
productName: Swob
directories:
  buildResources: build
files:
  # Runtime allowlist. Production node_modules are added by electron-builder
  # from package.json/package-lock.json; everything else must be named here.
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - LICENSE
  - NOTICE
  - THIRD_PARTY_NOTICES
  # Defense in depth: keep private worktrees and non-runtime project trees out
  # even if a future allowlist entry becomes too broad.
  - '!**/.claude/**'
  - '!**/.git/**'
  - '!**/.git'
  - '!**/.worktrees/**'
  - '!compliance/**'
  - '!e2e/**'
  - '!docs/**'
  - '!test/**'
  - '!tests/**'
  - '!**/__tests__/**'
  - '!**/*.test.*'
  - '!**/*.spec.*'
  - '!scripts/**'
  - '!README*'
  - '!CHANGELOG.md'
  - '!CLAUDE.md'
  - '!electron.vite.config.*'
  - '!{tsconfig,tsconfig.*}.json'
extraResources:
  - from: out/main/cli.js
    to: cli/cli.js
  - from: out/main/chunks/
    to: cli/chunks/
  # Keep the same outer notices contract on macOS, Windows, and Linux.
  - from: LICENSE
    to: LICENSE.txt
  - from: NOTICE
    to: NOTICE
  - from: THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
mac:
  # Release builds must fail closed: Developer ID signing, hardened runtime,
  # notarization, and stapling are all required for Gatekeeper acceptance.
  hardenedRuntime: true
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: swob-${version}-${arch}.${ext}
dmg:
  # ZIP blockmaps are the only immutable update inputs. DMG blockmaps are not
  # published and would violate the exact-six release asset contract.
  writeUpdateInfo: false
win:
  # Windows Beta remains unsigned until Artifact Signing identity validation is complete.
  # The beta marker is part of the immutable public asset contract.
  target:
    - target: nsis
      arch:
        - x64
  artifactName: swob-${version}-windows-beta-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: IvyYang1999
  repo: swob
  # v1.2.0 used the default latest channel but cannot verify a changed app
  # (arm64 was ad-hoc, x64 unsigned). Signed releases use an isolated trust root.
  channel: swob-signed
  # Release builds may attach isolated swob-canary metadata. The promotion
  # workflow alone may expose swob-signed after a real install-and-relaunch E2E.
  publishAutoUpdate: false
  releaseType: release
