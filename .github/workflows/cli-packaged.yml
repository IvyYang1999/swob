name: Packaged CLI Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cli-packaged.yml'
      - 'electron-builder.yml'
      - 'electron.vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/run-cli-packaged-contract.mjs'
      - 'scripts/packaged-cli-isolation.mjs'
      - 'scripts/packaged-cli-isolation.selftest.mjs'
      - 'src/cli/**'
      - 'src/main/**'
      - 'src/main/cli-install*'
      - 'src/main/runtime-home*'
      - 'src/shared/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/cli-packaged.yml'
      - 'electron-builder.yml'
      - 'electron.vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/run-cli-packaged-contract.mjs'
      - 'scripts/packaged-cli-isolation.mjs'
      - 'scripts/packaged-cli-isolation.selftest.mjs'
      - 'src/cli/**'
      - 'src/main/**'
      - 'src/main/cli-install*'
      - 'src/main/runtime-home*'
      - 'src/shared/**'

jobs:
  packaged-cli:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cli:packaged
